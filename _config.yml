# AISTATS conference site settings
# Replace every 20XX placeholder for the new year (repo name, baseurl, year, banner title, email).

title: Artificial Intelligence and Statistics Conference
description: >-
  Website for the AISTATS 20XX conference (Artificial Intelligence and Statistics).
url: "https://aistats.org"
baseurl: "/aistats20XX/"
# Timezone for deadline display (listdates.html). Use AOE for Anywhere on Earth
# (end of day). Override per deadline with tz: UTC (or CEST, …).
timezone: AOE

repository: aistats/aistats20XX

# Conference Twitter/X handle (shared society account is fine)
twitter_username: aistats_conf

github_username: aistats

author:
  name: AISTATS
  # Conference contact mailbox, e.g. aistats20XX@gmail.com
  email:
comments: false

markdown: kramdown
plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-remote-theme
encoding: utf-8
remote_theme: aistats/jekyll-theme
# Selects AISTATS CSS, favicon, and style-specific includes in the shared theme.
# Clarified or replaced under CIP-0002 Phase C (branding); keep as aistats until then.
style: aistats

ghub:
  edit: true
  repository: aistats20XX

# Banner file must live under assets/images/
banner: resort.png
banner_title: Artificial Intelligence and Statistics 20XX

conference:
  full_name: Artificial Intelligence and Statistics
  short_name: AISTATS
  name: Artificial Intelligence and Statistics
  # True while the public programme is still draft
  draft: true
  # True to hide speakers marked tentative
  hide_tentative: true
  # Optional venue photo under assets/images/
  image: conference-venue.png
  proceedings:
    # PMLR (or other) proceedings URL once published
    url:
    show: false
  room:
  # Venue name, e.g. Splash Beach Resort
  venue:
  venue_url:
  # City, Country
  location:
  year: 20XX
  # Ordinal instance, e.g. 29th
  instance:
  styling: International Conference on

  # Conference meeting days: one YAML list entry per calendar day (not a single
  # range string). The theme and schedule helpers iterate these as individual days.
  # Preferred formats (pick one style and use it consistently):
  #   - 3 May 20XX
  #   - 4 May 20XX
  #   - 5 May 20XX
  # or ISO calendar dates:
  #   - 20XX-05-03
  #   - 20XX-05-04
  #   - 20XX-05-05
  dates:
  - TBA

  # OpenReview (or other) submission site
  submission:
    show: false
    url:
    name: OpenReview

  # Key dates shown on dates.md via {% include listdates.html %}.
  # Fields: name, type, date; optional enddate, important, time, text, old, endold,
  # hide, tz (AOE | UTC | …; defaults to site.timezone).
  # Store parseable dates only — do not put "Anywhere on Earth" in date strings.
  deadlines:
    - name: Abstract submission deadline
      type: submission
      date:
      important: true
      # tz: AOE
    - name: Paper submission deadline
      type: submission
      date:
      important: true
    - name: Author response period
      type: review
      date:
      enddate:
      important: true
    - name: Paper decision notifications
      type: decision
      date:
      important: true
    - name: Camera-ready deadline
      type: submission
      date:
      important: true
    - name: Journal-to-Conference track deadline
      type: submission
      date:
      important: true
    - name: Workshop submission deadline
      type: submission
      date:
    - name: Conference dates
      type: submission
      date:
      enddate:
      important: true

  # Organising chairs (rendered on committee.html). Leave people blank until appointed.
  chairs:
  - type: General Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Program Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Workflow Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Local Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Publication Chair
    people:
    - family:
      given:
      url:
      institute:
  - type: Sponsorship Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Inclusivity Chair
    people:
    - family:
      given:
      url:
      institute:
  - type: Journal-to-Conference Chair
    people:
    - family:
      given:
      url:
      institute:
  # Optional roles used in recent years:
  # - type: Workshop Chairs
  # - type: Publicity Chair
