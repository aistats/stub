# Site settings
title: Artificial Intelligence and Statistics Conference
description: > # this means to ignore newlines until "baseurl:"
  This is the website of the AISTATS 20XX conference.
# url: "https://aistats.org"
baseurl: "/aistats20XX/" # the subpath of your site, e.g. /blog/
# timezone: # e.g. UTC, EST, ICT

repository: aistats/aistats20XX

# If you want to create a twitter account for your conference include
# twitter name here
twitter_username: aistats_conf

github_username:  aistats

author:
  name: AISTATS
  # Create an email for handling conference queries, e.g. aistats20XX@gmail.com.
  email:
comments: false

# Build settings
markdown: kramdown
plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-remote-theme
# change encoding for the generated output files to utf-8
encoding: utf-8
remote_theme: aistats/jekyll-theme
style: aistats

ghub:
  edit: true
  repository: aistats20XX

# Place a banner image in assets/images and give its name here.
banner: resort.png
banner_title: Artificial Intelligence and Statistics 20XX

conference:
  full_name: Artificial Intelligence and Statistics
  short_name: AISTATS
  name: Artificial Intelligence and Statistics
  # set to true if the programme is draft only.
  draft: true
  # set to true to hide tentative speakers
  hide_tentative: true
  # Place an image of venue in assets/images and give its name here
  image: conference-venue.png
  proceedings:
    # When proceedings are published add url here.
    url:
    show: false
  # Give details of the room in the venue here.
  room:
  # Set the name of the venue (e.g. Caribe Hilton Hotel)
  venue:
  # Give the url of the venue here.
  venue_url:
  # Give the conference location in the form City, Country here.
  location:
  year: 20XX
  # Give the instance of the conference here (e.g. 29th)
  instance:
  # Styling for AISTATS is "International Conference"
  styling: International Conference on
  # Give the individual days that the conference will be held on here.
  dates:
  - TBA
  # Give the submission site details here.
  submission:
    # Whether to show the submission site.
    show: false
    # The URL of the submission site.
    url:
    # The name of the submission site (e.g. OpenReview)
    name:
  deadlines:
    # Fill in the key dates as below. Optional fields: enddate, important, time, text, old, endold, hide.
    - name: Abstract submission deadline
      type: submission
      date:
      important: true
    - name: Paper submission deadline
      type: submission
      date:
      important: true
    - name: Author response period
      type: review
      date:
      enddate:
      important: true
    - name: Paper decision notifications
      type: decision
      date:
      important: true
    - name: Camera-ready deadline
      type: submission
      date:
      important: true
    - name: Conference dates
      type: submission
      date:
      enddate:
      important: true
  # List organising chairs here. Leave people empty until appointed.
  chairs:
  - type: General Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Program Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Workflow Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Local Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Publication Chair
    people:
    - family:
      given:
      url:
      institute:
  - type: Sponsorship Chairs
    people:
    - family:
      given:
      url:
      institute:
  - type: Inclusivity Chair
    people:
    - family:
      given:
      url:
      institute:
  - type: Journal-to-Conference Chair
    people:
    - family:
      given:
      url:
      institute:
  # Optional roles used in recent years:
  # - type: Workshop Chairs
  # - type: Publicity Chair
